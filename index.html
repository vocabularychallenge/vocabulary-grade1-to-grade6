ิปโป','The hippo is in the water.','ฮิปโปอยู่ในน้ำ',['Elephant','Hippo','Bear']],['🐊','Crocodile','จระเข้','Be careful! A crocodile!','ระวัง! มีจระเข้!',['Crocodile','Monkey','Tiger']],['🐻','Bear','หมี','Where is the bear?','หมีอยู่ที่ไหน?',['Panda','Bear','Lion']]];let answered={},score=0;const root=document.getElementById('questions');function speak(t){if(!('speechSynthesis'in window)){alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function render(){root.innerHTML='';data.forEach((d,i)=>{const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='top';top.innerHTML=`<div class="animal" aria-hidden="true">${d[0]}</div><div><div class="hint">ข้อ ${i+1} / 10 · ${d[2]}</div><div class="question">What animal is this?</div><div class="hint">สัตว์นี้ภาษาอังกฤษเรียกว่าอะไร?</div></div>`;card.append(top);const opts=document.createElement('div');opts.className='options';d[5].forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o;if(answered[i]!==undefined){b.disabled=true;if(o===d[1])b.classList.add('correct');else if(o===answered[i])b.classList.add('wrong')}b.onclick=()=>choose(i,o);opts.append(b)});card.append(opts);if(answered[i]!==undefined){const lesson=document.createElement('div');lesson.className='lesson show';const fb=document.createElement('div');fb.className='feedback';fb.textContent=answered[i]===d[1]?'✅ ถูกต้อง เก่งมาก!':'❌ คำตอบที่ถูกคือ '+d[1];lesson.append(fb);const sentence=document.createElement('div');sentence.innerHTML=`<strong>${d[3]}</strong><div>${d[4]}</div>`;lesson.append(sentence);const sp=document.createElement('button');sp.className='speak';sp.textContent='🔊 ฟังภาษาอังกฤษ';sp.onclick=()=>speak(d[3]);lesson.append(sp);card.append(lesson)}root.append(card)});const n=Object.keys(answered).length;document.getElementById('count').textContent=`ตอบแล้ว ${n}/10 ข้อ`;document.getElementById('score').textContent=`⭐ ${score} คะแนน`;document.getElementById('bar').style.width=n*10+'%';document.getElementById('finish').style.display=n===10?'block':'none';document.getElementById('final').textContent=`${score} / 10 คะแนน`}function choose(i,o){if(answered[i]!==undefined)return;answered[i]=o;if(o===data[i][1])score++;render()}document.getElementById('start').onclick=()=>{document.body.classList.add('playing');window.scrollTo(0,0)};document.getElementById('restart').onclick=()=>{answered={};score=0;if('speechSynthesis' in window)speechSynthesis.cancel();render();document.body.classList.remove('playing');window.scrollTo({top:0,behavior:'instant'})};render();</script><style>.share-kit{position:fixed;right:12px;bottom:12px;z-index:10000;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.share-kit button{background:#176e52;color:white;border:2px solid white;border-radius:22px;padding:10px 13px;font:700 14px system-ui;box-shadow:0 3px 14px #0003;cursor:pointer}</style><div class="share-kit"><button onclick="shareZooGame()">🔗 แชร์เกม</button><button onclick="downloadZooGame()">⬇️ ดาวน์โหลด</button></div><script>async function shareZooGame(){const url=location.href;if(location.protocol==='file:'||location.protocol==='content:'){alert('หากต้องการแชร์ลิงก์ให้ผู้อื่นเล่น กรุณาอัปโหลดเกมขึ้นเว็บไซต์ก่อน');return;}if(navigator.share){try{await navigator.share({title:'Zoo Vocabulary',text:'มาเล่นเกมทายคำศัพท์สัตว์กัน!',url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);alert('คัดลอกลิงก์เกมแล้ว')}catch(e){prompt('คัดลอกลิงก์เกม',url)}}function downloadZooGame(){const a=document.createElement('a');a.href=location.href;a.download='zoo_vocabulary_game.html';document.body.appendChild(a);a.click();a.remove()}</script></body></html>
