<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaiPai Hostel — Admin</title><style>
*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans Thai',sans-serif;background:#eef3f1;color:#15382f;margin:0}header{background:#07513d;color:white;padding:24px 18px}header h1{font-size:25px;margin:0 0 12px}header a{color:white}main{max-width:620px;margin:30px auto;padding:0 15px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 22px #102c201c}input,button{display:block;width:100%;padding:14px;border-radius:11px;font:inherit;margin:9px 0 16px}input{border:1px solid #a8bdb3}button{border:0;background:#087451;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.5}#msg{white-space:pre-line;color:#9a3b23}.hidden{display:none}.note{font-size:14px;line-height:1.65;color:#52645e}.status{color:#087451;font-weight:750}
</style></head><body><header><h1>🌿 PaiPai Hostel — หลังบ้าน</h1><a href="./customer.html" target="_blank" rel="noopener">🏠 ดูหน้าจองลูกค้า ↗</a></header><main><div class="card"><h2>เข้าสู่ระบบแอดมิน</h2><p class="note">ล็อกอินด้วยบัญชี Supabase Auth ที่ได้รับสิทธิ์แอดมิน ไม่ใช้รหัส 1978 ที่ฝังในหน้าเว็บ</p><form id="loginForm"><label>อีเมลแอดมิน<input id="email" type="email" autocomplete="username" required></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">เข้าสู่ระบบ</button></form><section id="dashboard" class="hidden"><p class="status">✓ เข้าสู่ระบบสำเร็จ และได้รับสิทธิ์แอดมิน</p><p id="role"></p><p class="note">หน้าจัดการการจองและราคาอยู่ระหว่างเชื่อมกับฐานข้อมูลกลาง เวอร์ชันนี้ยังไม่อนุญาตให้แก้ไขข้อมูลการจอง</p><button id="logout" type="button">ออกจากระบบ</button></section><p id="msg" role="status"></p></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://wkxizzjgihgqkejjcbug.supabase.co','sb_publishable_GWHcqqI1CzjI29r_V5ZNYw_TancH9xB');
const $=id=>document.getElementById(id);const showError=e=>$('msg').textContent=e;
async function refresh(){const {data:{user},error}=await supabase.auth.getUser();if(error||!user){$('loginForm').classList.remove('hidden');$('dashboard').classList.add('hidden');return}const result=await supabase.from('staff').select('role').eq('user_id',user.id).eq('active',true).maybeSingle();if(result.error||!result.data){await supabase.auth.signOut();$('loginForm').classList.remove('hidden');$('dashboard').classList.add('hidden');showError('บัญชีนี้ยังไม่ได้รับสิทธิ์แอดมินในตาราง staff กรุณาติดต่อเจ้าของระบบ');return}$('loginForm').classList.add('hidden');$('dashboard').classList.remove('hidden');$('role').textContent='สิทธิ์: '+result.data.role;showError('')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;showError('กำลังตรวจสอบ...');try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){showError('เข้าสู่ระบบไม่สำเร็จ ตรวจสอบอีเมลและรหัสผ่าน');return}await refresh()}catch(e){showError('เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่')}finally{$('loginButton').disabled=false}});
$('logout').addEventListener('click',async()=>{await supabase.auth.signOut();await refresh()});refresh();
</script></body></html>
