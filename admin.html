<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaiPai Hostel Admin</title><style>body{font-family:system-ui,sans-serif;background:#f2f5f5;color:#16362e;margin:0}header{background:#064637;color:white;padding:18px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 1px 6px #ccc}input,select,button{font:inherit;padding:12px;border:1px solid #a6b7b2;border-radius:9px;margin:5px 0;max-width:100%;box-sizing:border-box}button{background:#08734f;color:white;border:0;font-weight:700;cursor:pointer}a{color:#06795b}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}.scroll{overflow-x:auto}.muted{color:#526760}#dashboard{display:none}</style><header><h2>🌿 PaiPai Hostel — หลังบ้าน</h2><a href="/" target="_blank" style="color:white">🏠 ดูหน้าจองลูกค้า ↗</a></header><main><section id="login" class="card"><h3>เข้าสู่ระบบแอดมิน</h3><input id="password" type="password" placeholder="รหัสแอดมิน" autocomplete="current-password"><button onclick="login()">เข้าสู่ระบบ</button><p id="loginmsg"></p></section><div id="dashboard"><section class="card"><h3>คำขอจองและสลิป</h3><button onclick="load()">🔄 โหลดข้อมูลล่าสุด</button> <button onclick="logout()">ออกจากระบบ</button><p class="muted">ตรวจยอดโอนในบัญชีธนาคารก่อนกดยืนยันการจอง</p><div class="scroll"><table><thead><tr><th>รหัส</th><th>ลูกค้า</th><th>วันพัก</th><th>ห้อง</th><th>ยอด</th><th>สถานะ</th><th>สลิป</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card"><h3>เปิด–ปิดห้องและตั้งราคา</h3><p class="muted">บันทึกเป็นรายห้องและรายวัน</p><select id="room"></select><input type="date" id="day"><select id="closed"><option value="0">เปิดขาย</option><option value="1">ปิดขาย</option></select><input type="number" id="price" min="1" placeholder="ราคาต่อคืน"><button onclick="saveRoom()">💾 บันทึก</button><p id="savemsg"></p><div id="inventory"></div></section></div></main><script>
const $=id=>document.getElementById(id), types={Q:2,T:3,D:4}, prices={Q:550,T:650,D:300};for(const [t,n] of Object.entries(types))for(let i=1;i<=n;i++)$('room').add(new Option(t+i,t+i));$('price').value=550;$('room').onchange=()=>{$('price').value=prices[$('room').value[0]]};$('day').value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
async function req(path,method='GET',obj){const r=await fetch(path,{method,headers:obj?{'Content-Type':'application/json'}:{},body:obj?JSON.stringify(obj):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'เกิดข้อผิดพลาด');return j}
async function login(){try{await req('/api/admin/login','POST',{password:$('password').value});$('login').style.display='none';$('dashboard').style.display='block';load()}catch(e){$('loginmsg').textContent=e.message}}
async function logout(){await req('/api/admin/logout','POST');location.reload()}
function d(x){return x.split('-').reverse().join('/')}
async function load(){try{const bookings=await req('/api/admin/bookings');$('rows').innerHTML=bookings.map(r=>{const it=JSON.parse(r.items).map(i=>i.rooms.join(',')).join(' ');return `<tr><td><b>${r.code}</b></td><td>${escapeHTML(r.guest)}<br>${escapeHTML(r.phone)}<br>${escapeHTML(r.email)}</td><td>${d(r.ci)}<br>${d(r.co)}</td><td>${it}</td><td>฿${r.total.toLocaleString()}</td><td>${r.status}</td><td><a href="/api/admin/slip/${r.code}" target="_blank">ดูสลิป</a></td><td><button onclick="changeStatus('${r.code}','confirmed')">ยืนยัน</button><button onclick="changeStatus('${r.code}','cancelled')" style="background:#b33">ยกเลิก</button></td></tr>`}).join('')||'<tr><td colspan="8">ยังไม่มีรายการ</td></tr>';const inv=await req('/api/admin/inventory');$('inventory').textContent='รายการที่บันทึก: '+inv.length+' วัน/ห้อง'}catch(e){alert(e.message)}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function changeStatus(code,status){if(!confirm(`ยืนยันการ${status==='confirmed'?'ยืนยัน':'ยกเลิก'}จอง #${code} ?`))return;try{const r=await req('/api/admin/status/'+code,'POST',{status});alert(r.email_sent?'บันทึกและส่งอีเมลลูกค้าแล้ว':'บันทึกแล้ว แต่อีเมลส่งไม่สำเร็จ');load()}catch(e){alert(e.message)}}
async function saveRoom(){try{await req('/api/admin/inventory','POST',{room:$('room').value,day:$('day').value,closed:$('closed').value==='1',price:Number($('price').value)});$('savemsg').textContent='บันทึกสำเร็จ';load()}catch(e){$('savemsg').textContent=e.message}}
</script></html>
